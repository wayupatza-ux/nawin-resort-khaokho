<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>จองที่พัก — Nawin Resort Khaokho</title>
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">จองที่พัก</div>
    <div class="sub">Nawin Resort Khaokho — เขาค้อ</div>
  </header>
  <main id="main">
    <div class="spinner"></div>
  </main>
  <nav class="bottom">
    <a href="./booking.html" class="active">จองที่พัก</a>
    <a href="./my-bookings.html">การจองของฉัน</a>
  </nav>
</div>
<script type="module">
  import { supabase, ensureLiff, getIdToken, callGuestApi, fmtBaht } from "./assets/app.js";

  const main = document.getElementById("main");
  let units = [];
  let selectedUnitId = null;

  function render() {
    main.innerHTML = `
      <div id="msgBox"></div>
      <section class="card">
        <h3>เลือกห้อง</h3>
        <div id="unitList"></div>
      </section>
      <section class="card">
        <h3>ข้อมูลผู้จอง</h3>
        <div class="field">
          <label>ชื่อ-นามสกุล</label>
          <input type="text" id="fullName" placeholder="เช่น สมชาย ใจดี" />
        </div>
        <div class="field">
          <label>เบอร์โทรศัพท์</label>
          <input type="tel" id="phone" placeholder="เช่น 0812345678" />
        </div>
        <div class="meta" style="margin-top:4px;">ใช้สำหรับติดต่อและเช็คอินเมื่อถึงรีสอร์ท</div>
      </section>
      <section class="card">
        <h3>วันที่เข้าพัก</h3>
        <div class="row">
          <div class="field">
            <label>เช็คอิน</label>
            <input type="date" id="checkIn" />
          </div>
          <div class="field">
            <label>เช็คเอาท์</label>
            <input type="date" id="checkOut" />
          </div>
        </div>
        <div class="field">
          <label>จำนวนผู้เข้าพัก</label>
          <input type="number" id="numGuests" min="1" value="1" />
        </div>
        <div class="field">
          <label>หมายเหตุ (ถ้ามี)</label>
          <textarea id="notes" rows="2" placeholder="เช่น เวลาเดินทางถึงโดยประมาณ"></textarea>
        </div>
      </section>
      <div id="totalPreview" class="card" style="text-align:center; border-color:var(--clay); margin-bottom:10px;">
        <div class="meta">เลือกห้องและวันที่เพื่อดูยอดรวม</div>
      </div>
      <button class="primary" id="submitBtn">ยืนยันการจอง</button>
      <div id="lightbox" style="display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; flex-direction:column;">
        <img id="lightboxImg" src="" style="max-width:94vw; max-height:82vh; object-fit:contain; border-radius:8px;" />
        <button id="lightboxClose" style="margin-top:16px; background:#fff; border:none; border-radius:20px; padding:8px 20px; font-size:1rem;">ปิด</button>
      </div>
    `;

    const unitList = document.getElementById("unitList");
    if (units.length === 0) {
      unitList.innerHTML = `<div class="empty">ยังไม่มีห้องเปิดให้จอง</div>`;
    } else {
      unitList.innerHTML = units
        .map(
          (u) => `
        <div class="card unit-card" data-id="${u.id}" style="margin-bottom:10px; flex-direction:column; align-items:stretch;">
          ${
            u.photo_urls && u.photo_urls.length
              ? `<div class="unit-photos" style="position:relative; margin-bottom:8px;">
                  <div style="display:flex; gap:6px; overflow-x:auto;">
                    ${u.photo_urls.map((url) => `<img src="${url}" data-photo="${url}" style="width:96px; height:72px; object-fit:cover; border-radius:8px; flex-shrink:0; cursor:zoom-in;" />`).join("")}
                  </div>
                  <div class="zoom-hint">🔍 แตะรูปเพื่อดูขยาย</div>
                </div>`
              : ""
          }
          <div class="unit-select-row">
            <div class="unit-radio" aria-hidden="true"></div>
            <div style="flex:1;">
              <div class="name">${u.name}</div>
              <div class="meta">${typeLabel(u.unit_type)} · เข้าพักได้ ${u.capacity} คน</div>
            </div>
            <div class="price">${unitPriceLabel(u)}<div class="meta">/คืน</div></div>
          </div>
          <button type="button" class="ghost select-room-btn">เลือกห้องนี้</button>
        </div>`,
        )
        .join("");

      function selectUnit(el) {
        selectedUnitId = el.dataset.id;
        unitList.querySelectorAll(".unit-card").forEach((c) => {
          c.classList.remove("selected");
          c.querySelector(".select-room-btn").textContent = "เลือกห้องนี้";
        });
        el.classList.add("selected");
        el.querySelector(".select-room-btn").textContent = "✓ เลือกห้องนี้แล้ว";
        updateTotalPreview();
      }

      unitList.querySelectorAll(".select-room-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          selectUnit(btn.closest(".unit-card"));
        });
      });
      unitList.querySelectorAll(".unit-select-row").forEach((row) => {
        row.addEventListener("click", () => selectUnit(row.closest(".unit-card")));
      });

      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      unitList.querySelectorAll("img[data-photo]").forEach((img) => {
        img.addEventListener("click", (e) => {
          e.stopPropagation();
          lightboxImg.src = img.dataset.photo;
          lightbox.style.display = "flex";
        });
      });
      document.getElementById("lightboxClose").addEventListener("click", () => {
        lightbox.style.display = "none";
        lightboxImg.src = "";
      });
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
          lightbox.style.display = "none";
          lightboxImg.src = "";
        }
      });
    }

    document.getElementById("submitBtn").addEventListener("click", submitBooking);
    document.getElementById("checkIn").addEventListener("change", updateTotalPreview);
    document.getElementById("checkOut").addEventListener("change", updateTotalPreview);
  }

  function typeLabel(t) {
    return { house: "บ้านพัก", tent: "เต็นท์กระโจม", other: "ที่พัก" }[t] || t;
  }

  // House units are priced by day-of-week (weekday/weekend + public
  // holidays) — show a range here since there's no single flat rate.
  // The exact total for the chosen dates is always shown after picking
  // check-in/check-out below.
  function unitPriceLabel(u) {
    if (u.weekday_price != null && u.weekend_price != null) {
      return `${fmtBaht(u.weekday_price)}–${fmtBaht(u.weekend_price)}`;
    }
    return fmtBaht(u.base_price);
  }

  // Real total varies by day-of-week/holiday for house units, so preview
  // it via the same calc_stay_total the server uses once room + dates
  // are picked — avoids surprising the guest with a different amount
  // than the per-night range shown on the room card.
  let previewToken = 0;
  async function updateTotalPreview() {
    const el = document.getElementById("totalPreview");
    if (!el) return;
    const checkIn = document.getElementById("checkIn").value;
    const checkOut = document.getElementById("checkOut").value;

    if (!selectedUnitId) {
      el.innerHTML = `<div class="meta">เลือกห้องและวันที่เพื่อดูยอดรวม</div>`;
      return;
    }
    if (!checkIn || !checkOut || checkOut <= checkIn) {
      el.innerHTML = `<div class="meta">เลือกวันเช็คอิน-เช็คเอาท์เพื่อดูยอดรวม</div>`;
      return;
    }
    const myToken = ++previewToken;
    el.innerHTML = `<div class="meta">กำลังคำนวณยอดรวม...</div>`;
    const { data, error } = await supabase.rpc("calc_stay_total", {
      p_unit_id: selectedUnitId,
      p_check_in: checkIn,
      p_check_out: checkOut,
    });
    if (myToken !== previewToken) return;
    if (error) {
      el.innerHTML = `<div class="meta">คำนวณยอดรวมไม่สำเร็จ</div>`;
      return;
    }
    const nights = Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000);
    el.innerHTML = `
      <div class="meta">ยอดรวม ${nights} คืน</div>
      <div style="font-size:1.5rem; font-weight:700; color:var(--clay-dark);">${fmtBaht(data)}</div>
    `;
  }

  function showMsg(text, kind = "error") {
    document.getElementById("msgBox").innerHTML = `<div class="msg ${kind}" style="margin-bottom:12px;">${text}</div>`;
  }

  async function submitBooking() {
    const fullName = document.getElementById("fullName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const checkIn = document.getElementById("checkIn").value;
    const checkOut = document.getElementById("checkOut").value;
    const numGuests = Number(document.getElementById("numGuests").value) || 1;
    const notes = document.getElementById("notes").value;

    if (!fullName) return showMsg("กรุณากรอกชื่อ-นามสกุล");
    if (!/^0\d{8,9}$/.test(phone)) return showMsg("กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง");
    if (!selectedUnitId) return showMsg("กรุณาเลือกห้องที่ต้องการจอง");
    if (!checkIn || !checkOut) return showMsg("กรุณาเลือกวันเช็คอินและเช็คเอาท์");
    if (checkOut <= checkIn) return showMsg("วันเช็คเอาท์ต้องอยู่หลังวันเช็คอิน");

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "กำลังจอง...";

    try {
      const idToken = await getIdToken();
      const { booking } = await callGuestApi("/book", {
        idToken,
        unitId: selectedUnitId,
        checkIn,
        checkOut,
        numGuests,
        notes,
        fullName,
        phone,
      });
      showMsg(`จองสำเร็จ! เลขที่จอง ${booking.booking_ref} — ทางรีสอร์ทจะติดต่อยืนยันผ่าน LINE`, "success");
      setTimeout(() => (window.location.href = "./my-bookings.html"), 1800);
    } catch (e) {
      showMsg(e.message || "จองไม่สำเร็จ กรุณาลองใหม่");
    } finally {
      btn.disabled = false;
      btn.textContent = "ยืนยันการจอง";
    }
  }

  async function init() {
    try {
      await ensureLiff();
      const { data, error } = await supabase
        .from("units")
        .select("id, code, name, unit_type, base_price, weekday_price, weekend_price, capacity, photo_urls")
        .eq("is_active", true)
        .order("unit_type");
      if (error) throw error;
      units = data || [];
      render();

      try {
        const idToken = await getIdToken();
        const profile = await callGuestApi("/profile", { idToken });
        if (profile.fullName) document.getElementById("fullName").value = profile.fullName;
        if (profile.phone) document.getElementById("phone").value = profile.phone;
      } catch {
        // prefill is a convenience only — ignore failures silently
      }
    } catch (e) {
      if (e.code === "OPEN_IN_LINE") {
        window.location.href = "./index.html";
        return;
      }
      main.innerHTML = `<div class="msg error">${e.message || "โหลดข้อมูลไม่สำเร็จ"}</div>`;
    }
  }

  init();
</script>
</body>
</html>
