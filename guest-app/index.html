<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nawin Resort Khaokho</title>
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Nawin Resort Khaokho</div>
    <div class="sub">เขาค้อ เพชรบูรณ์</div>
  </header>
  <main>
    <div id="status" class="msg info">กำลังเชื่อมต่อ LINE...</div>
    <div id="loading" class="spinner"></div>
  </main>
</div>
<script type="module">
  import { ensureLiff } from "./assets/app.js";

  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");

  ensureLiff()
    .then(() => {
      window.location.href = "./booking.html";
    })
    .catch((e) => {
      loadingEl.style.display = "none";
      statusEl.className = "msg error";
      statusEl.textContent = e.message || "เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่";
    });
</script>
</body>
</html>
