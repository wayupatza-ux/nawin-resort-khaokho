<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ตั้งรหัสผ่านใหม่ — Nawin Resort Khaokho</title>
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <div class="sub">Nawin Resort Khaokho Dashboard</div>
    <div id="msgBox"></div>
    <div id="formWrap" style="display:none;">
      <div class="field">
        <label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="newPassword" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" />
      </div>
      <button class="primary" id="saveBtn" style="width:100%;">บันทึกรหัสผ่านใหม่</button>
    </div>
  </div>
</div>
<script type="module">
  import { supabase } from "./assets/app.js";

  function showMsg(text, kind = "error") {
    document.getElementById("msgBox").innerHTML = `<div class="msg ${kind}">${text}</div>`;
  }

  async function init() {
    // supabase-js automatically parses the recovery token from the URL and
    // establishes a temporary session — just wait for that to land.
    const {
      data: { session },
    } = await supabase.auth.getSession();

    if (!session) {
      showMsg("ลิงก์นี้หมดอายุหรือไม่ถูกต้อง กรุณากด \"ลืมรหัสผ่าน?\" ที่หน้า login เพื่อขอลิงก์ใหม่");
      return;
    }
    document.getElementById("formWrap").style.display = "block";
  }

  document.getElementById("saveBtn").addEventListener("click", async () => {
    const p1 = document.getElementById("newPassword").value;
    const p2 = document.getElementById("confirmPassword").value;
    if (p1.length < 6) return showMsg("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");
    if (p1 !== p2) return showMsg("รหัสผ่านทั้งสองช่องไม่ตรงกัน");

    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึก...";
    const { error } = await supabase.auth.updateUser({ password: p1 });
    btn.disabled = false;
    btn.textContent = "บันทึกรหัสผ่านใหม่";

    if (error) return showMsg("บันทึกไม่สำเร็จ: " + error.message);
    showMsg("ตั้งรหัสผ่านใหม่สำเร็จ กำลังพาไปหน้า login...", "success");
    await supabase.auth.signOut();
    setTimeout(() => (window.location.href = "./index.html"), 1500);
  });

  init();
</script>
</body>
</html>
