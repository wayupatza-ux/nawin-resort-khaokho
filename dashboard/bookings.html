<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>การจอง — Nawin Resort Khaokho</title>
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<div class="layout">
  <nav class="side">
    <div class="brand">Nawin Resort<span class="sub">Khaokho Dashboard</span></div>
    <a href="./bookings.html" class="active">การจอง</a>
    <a href="./new-booking.html">เพิ่มการจอง (walk-in)</a>
    <a href="./payments.html">ชำระเงิน</a>
    <a href="./units.html" data-owner-only>ห้อง &amp; รายงาน</a>
    <button class="logout" id="logoutBtn">ออกจากระบบ</button>
  </nav>
  <div class="content">
    <header>
      <h1>การจอง</h1>
      <p>ปฏิทินภาพรวมทั้งเดือน + รายการจองทั้งหมด ค้นหาและจัดการสถานะได้ในหน้าเดียว</p>
    </header>
    <div id="msgBox"></div>

    <section>
      <div class="cal-toolbar">
        <button class="ghost" id="prevMonth">‹ เดือนก่อน</button>
        <div class="cal-month-label" id="monthLabel"></div>
        <button class="ghost" id="nextMonth">เดือนถัดไป ›</button>
        <button class="ghost" id="todayBtn">วันนี้</button>
      </div>
      <div class="cal-legend">
        <span><i class="cal-dot free"></i>ว่าง (คลิกเพื่อจอง)</span>
        <span><i class="cal-dot pending"></i>รอยืนยัน</span>
        <span><i class="cal-dot confirmed"></i>ยืนยันแล้ว</span>
        <span><i class="cal-dot checked_in"></i>เช็คอินแล้ว</span>
        <span><i class="cal-dot checked_out"></i>เช็คเอาท์แล้ว</span>
      </div>
      <div id="calWrap"><div class="empty">กำลังโหลด...</div></div>
    </section>

    <h3 class="section-heading">รายการจอง</h3>
    <div class="toolbar">
      <div class="field">
        <label>ค้นหา (เลขจอง / ชื่อแขก)</label>
        <input type="text" id="searchQuery" placeholder="เช่น A3F9K2 หรือ สมชาย" />
      </div>
      <div class="field">
        <label>สถานะ</label>
        <select id="filterStatus">
          <option value="">ทั้งหมด</option>
          <option value="pending">รอยืนยัน</option>
          <option value="confirmed">ยืนยันแล้ว</option>
          <option value="checked_in">เช็คอินแล้ว</option>
          <option value="checked_out">เช็คเอาท์แล้ว</option>
          <option value="cancelled">ยกเลิกแล้ว</option>
          <option value="no_show">ไม่มาเข้าพัก</option>
        </select>
      </div>
      <div class="field">
        <label>จากวันที่ (เช็คอิน)</label>
        <input type="date" id="filterFrom" />
      </div>
      <div class="field">
        <label>ถึงวันที่ (เช็คอิน)</label>
        <input type="date" id="filterTo" />
      </div>
      <div class="field">
        <label>จองโดย</label>
        <select id="filterCreatedBy">
          <option value="">ทั้งหมด</option>
        </select>
      </div>
      <button class="ghost" id="applyFilter">กรอง</button>
    </div>
    <div id="tableWrap"><div class="empty">กำลังโหลด...</div></div>
  </div>
</div>
<script type="module">
  import { supabase, requireSession, logout, fmtDate, fmtBaht, STATUS_TH, gateOwnerOnlyNav } from "./assets/app.js";

  const tableWrap = document.getElementById("tableWrap");
  const calWrap = document.getElementById("calWrap");
  const monthLabel = document.getElementById("monthLabel");
  const STATUSES = ["pending", "confirmed", "checked_in", "checked_out", "cancelled", "no_show"];

  let currentRows = [];
  let cursor = new Date();
  cursor.setDate(1);

  document.getElementById("logoutBtn").addEventListener("click", logout);
  document.getElementById("applyFilter").addEventListener("click", loadList);
  document.getElementById("searchQuery").addEventListener("input", renderFilteredList);
  document.getElementById("prevMonth").addEventListener("click", () => {
    cursor.setMonth(cursor.getMonth() - 1);
    loadCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    cursor.setMonth(cursor.getMonth() + 1);
    loadCalendar();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    cursor = new Date();
    cursor.setDate(1);
    loadCalendar();
  });

  function showMsg(text, kind = "error") {
    document.getElementById("msgBox").innerHTML = `<div class="msg ${kind}">${text}</div>`;
    setTimeout(() => (document.getElementById("msgBox").innerHTML = ""), 3000);
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // ---------- Calendar ----------

  function toISODate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function dayLabel(d) {
    return d.toLocaleDateString("th-TH", { weekday: "short" });
  }

  async function loadCalendar() {
    calWrap.innerHTML = `<div class="empty">กำลังโหลด...</div>`;
    monthLabel.textContent = cursor.toLocaleDateString("th-TH", { month: "long", year: "numeric" });

    const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    const daysInMonth = Math.round((monthEnd - monthStart) / 86400000);

    const [unitsRes, bookingsRes] = await Promise.all([
      supabase.from("units").select("id, code, name").eq("is_active", true).order("code"),
      supabase
        .from("bookings")
        .select("id, unit_id, check_in, check_out, status, booking_ref, guests(display_name)")
        .in("status", ["pending", "confirmed", "checked_in", "checked_out"])
        .lt("check_in", toISODate(monthEnd))
        .gt("check_out", toISODate(monthStart)),
    ]);

    if (unitsRes.error || bookingsRes.error) {
      const err = unitsRes.error || bookingsRes.error;
      calWrap.innerHTML = `<div class="msg error">โหลดปฏิทินไม่สำเร็จ: ${err.message}</div>`;
      return;
    }

    renderCalendar(unitsRes.data || [], bookingsRes.data || [], monthStart, daysInMonth);
  }

  function renderCalendar(units, bookings, monthStart, daysInMonth) {
    if (!units.length) {
      calWrap.innerHTML = `<div class="empty">ยังไม่มีห้อง</div>`;
      return;
    }

    const todayISO = toISODate(new Date());
    const days = Array.from({ length: daysInMonth }, (_, i) => {
      const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), i + 1);
      return { date: d, iso: toISODate(d) };
    });

    let html = `<table class="cal-table"><thead><tr><th class="cal-unit-col">ห้อง</th>`;
    for (const d of days) {
      const dow = d.date.getDay();
      const weekend = dow === 0 || dow === 6;
      const isToday = d.iso === todayISO;
      html += `<th class="cal-day-head${weekend ? " weekend" : ""}${isToday ? " today" : ""}"><span class="dnum">${d.date.getDate()}</span><span class="dname">${dayLabel(d.date)}</span></th>`;
    }
    html += `</tr></thead><tbody>`;

    for (const unit of units) {
      const unitBookings = bookings.filter((b) => b.unit_id === unit.id);
      html += `<tr><td class="cal-unit-col">${escapeHtml(unit.name)}</td>`;
      for (const d of days) {
        const b = unitBookings.find((bk) => d.iso >= bk.check_in && d.iso < bk.check_out);
        const weekend = d.date.getDay() === 0 || d.date.getDay() === 6;
        const isToday = d.iso === todayISO;
        if (b) {
          const guestName = b.guests?.display_name || "แขก";
          html += `<td class="cal-cell ${b.status}${isToday ? " today" : ""}" title="${escapeHtml(guestName)} · ${STATUS_TH[b.status]} · ${escapeHtml(b.booking_ref)}">${escapeHtml(guestName)}</td>`;
        } else {
          html += `<td class="cal-cell free${weekend ? " weekend" : ""}${isToday ? " today" : ""}" data-unit="${unit.id}" data-date="${d.iso}" title="ว่าง — คลิกเพื่อเพิ่มการจอง"></td>`;
        }
      }
      html += `</tr>`;
    }
    html += `</tbody></table>`;
    calWrap.innerHTML = html;

    calWrap.querySelectorAll("td.cal-cell.free").forEach((cell) => {
      cell.addEventListener("click", () => {
        const unitId = cell.dataset.unit;
        const date = cell.dataset.date;
        window.location.href = `./new-booking.html?unit=${encodeURIComponent(unitId)}&checkin=${encodeURIComponent(date)}`;
      });
    });
  }

  // ---------- Booking list ----------

  async function loadCreatedByOptions() {
    const sel = document.getElementById("filterCreatedBy");
    const { data, error } = await supabase.from("profiles").select("id, display_name, role").order("display_name");
    if (error || !data) return;
    const options = data
      .map((p) => `<option value="${p.id}">${escapeHtml(p.display_name || p.role)}</option>`)
      .join("");
    sel.innerHTML = `<option value="">ทั้งหมด</option><option value="__self__">แขกจองเอง (LINE)</option>${options}`;
  }

  async function loadList() {
    tableWrap.innerHTML = `<div class="empty">กำลังโหลด...</div>`;
    let query = supabase
      .from("bookings")
      .select("id, booking_ref, check_in, check_out, num_guests, status, total_amount, guests(display_name, phone), units(name), creator:profiles!bookings_created_by_fkey(display_name)")
      .order("check_in", { ascending: false })
      .limit(200);

    const status = document.getElementById("filterStatus").value;
    const from = document.getElementById("filterFrom").value;
    const to = document.getElementById("filterTo").value;
    const createdBy = document.getElementById("filterCreatedBy").value;
    if (status) query = query.eq("status", status);
    if (from) query = query.gte("check_in", from);
    if (to) query = query.lte("check_in", to);
    if (createdBy === "__self__") query = query.is("created_by", null);
    else if (createdBy) query = query.eq("created_by", createdBy);

    const { data, error } = await query;
    if (error) {
      tableWrap.innerHTML = `<div class="msg error">โหลดข้อมูลไม่สำเร็จ: ${error.message}</div>`;
      return;
    }
    currentRows = data || [];
    renderFilteredList();
  }

  function renderFilteredList() {
    const q = document.getElementById("searchQuery").value.trim().toLowerCase();
    const rows = q
      ? currentRows.filter((b) => {
          const ref = (b.booking_ref || "").toLowerCase();
          const name = (b.guests?.display_name || "").toLowerCase();
          return ref.includes(q) || name.includes(q);
        })
      : currentRows;
    renderList(rows);
  }

  function renderList(rows) {
    if (!rows.length) {
      tableWrap.innerHTML = `<div class="empty">ไม่พบการจอง</div>`;
      return;
    }
    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>เลขที่จอง</th><th>ห้อง</th><th>แขก</th><th>เช็คอิน</th><th>เช็คเอาท์</th>
            <th>คน</th><th>ยอดเงิน</th><th>จองโดย</th><th>สถานะ</th>
          </tr>
        </thead>
        <tbody>
          ${rows
            .map(
              (b) => `
            <tr>
              <td>${escapeHtml(b.booking_ref)}</td>
              <td>${escapeHtml(b.units?.name ?? "-")}</td>
              <td>${escapeHtml(b.guests?.display_name ?? "-")}${b.guests?.phone ? " · " + escapeHtml(b.guests.phone) : ""}</td>
              <td>${fmtDate(b.check_in)}</td>
              <td>${fmtDate(b.check_out)}</td>
              <td>${b.num_guests}</td>
              <td>${fmtBaht(b.total_amount)}</td>
              <td>${escapeHtml(b.creator?.display_name ?? "แขกจองเอง (LINE)")}</td>
              <td>
                <select class="status-select" data-id="${b.id}" data-current="${b.status}">
                  ${STATUSES.map((s) => `<option value="${s}" ${s === b.status ? "selected" : ""}>${STATUS_TH[s]}</option>`).join("")}
                </select>
              </td>
            </tr>`,
            )
            .join("")}
        </tbody>
      </table>
    `;

    tableWrap.querySelectorAll("select.status-select").forEach((sel) => {
      sel.addEventListener("change", () => updateStatus(sel));
    });
  }

  async function updateStatus(sel) {
    const id = sel.dataset.id;
    const newStatus = sel.value;
    const prev = sel.dataset.current;
    sel.disabled = true;
    const { error } = await supabase.from("bookings").update({ status: newStatus }).eq("id", id);
    sel.disabled = false;
    if (error) {
      showMsg("อัปเดตสถานะไม่สำเร็จ: " + error.message);
      sel.value = prev;
      return;
    }
    sel.dataset.current = newStatus;
    const row = currentRows.find((b) => b.id === id);
    if (row) row.status = newStatus;
    showMsg("อัปเดตสถานะสำเร็จ", "success");
  }

  async function init() {
    const session = await requireSession();
    if (!session) return;
    await gateOwnerOnlyNav(session);
    await loadCreatedByOptions();
    await Promise.all([loadCalendar(), loadList()]);
  }

  init();
</script>
</body>
</html>
