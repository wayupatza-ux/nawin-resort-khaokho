<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>เพิ่มการจอง — Nawin Resort Khaokho</title>
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">เพิ่มการจอง</div>
    <div class="sub" id="staffLabel">Nawin Resort Khaokho</div>
  </header>
  <main id="main">
    <div class="spinner"></div>
  </main>
</div>
<script type="module">
  import { supabase, ensureLiff, getIdToken, callStaffApi, fmtBaht } from "./assets/app.js";
  import { buildPromptPayPayload, qrImageUrl } from "./assets/promptpay.js";

  const main = document.getElementById("main");
  let units = [];
  let idToken = null;
  let totalTouchedByUser = false;
  let resortSettings = {};

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function typeLabel(t) {
    return { house: "บ้านพัก", tent: "เต็นท์กระโจม", other: "ที่พัก" }[t] || t;
  }

  function render() {
    main.innerHTML = `
      <div id="msgBox"></div>
      <section class="card">
        <h3>ห้อง</h3>
        <select id="unitId">
          ${units.map((u) => `<option value="${u.id}" data-price="${u.base_price}">${u.name} (${fmtBaht(u.base_price)}/คืน)</option>`).join("")}
        </select>
      </section>
      <section class="card">
        <h3>ข้อมูลลูกค้า</h3>
        <div class="field"><label>ชื่อแขก</label><input type="text" id="guestName" /></div>
        <div class="field"><label>เบอร์โทร</label><input type="tel" id="guestPhone" /></div>
      </section>
      <section class="card">
        <h3>วันที่เข้าพัก</h3>
        <div class="row">
          <div class="field"><label>เช็คอิน</label><input type="date" id="checkIn" /></div>
          <div class="field"><label>เช็คเอาท์</label><input type="date" id="checkOut" /></div>
        </div>
        <div class="field"><label>จำนวนผู้เข้าพัก</label><input type="number" id="numGuests" min="1" value="1" /></div>
        <div class="field">
          <label>ยอดรวม (บาท)</label>
          <input type="number" id="totalAmount" min="0" step="0.01" placeholder="เลือกห้อง+วันที่ก่อน" />
          <div id="priceHint" style="font-size:0.78rem; color:var(--ink-soft); margin-top:4px;"></div>
        </div>
        <div class="field"><label>หมายเหตุ</label><textarea id="notes" rows="2" placeholder="เช่น เหตุผลที่ปรับราคา"></textarea></div>
      </section>
      <button class="primary" id="submitBtn">บันทึกการจอง</button>
      <div id="paymentResultWrap"></div>
    `;

    document.getElementById("unitId").addEventListener("change", recalcPrice);
    document.getElementById("checkIn").addEventListener("change", recalcPrice);
    document.getElementById("checkOut").addEventListener("change", recalcPrice);
    document.getElementById("totalAmount").addEventListener("input", () => {
      totalTouchedByUser = true;
      recalcPrice();
    });
    document.getElementById("submitBtn").addEventListener("click", submitBooking);
    recalcPrice();
  }

  function computeStandardPrice() {
    const unitId = document.getElementById("unitId").value;
    const checkIn = document.getElementById("checkIn").value;
    const checkOut = document.getElementById("checkOut").value;
    const opt = document.querySelector(`#unitId option[value="${unitId}"]`);
    const price = Number(opt?.dataset.price || 0);
    if (!unitId || !checkIn || !checkOut || checkOut <= checkIn) return null;
    const nights = Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000);
    return { price, nights, total: price * nights };
  }

  function recalcPrice() {
    const calc = computeStandardPrice();
    const hint = document.getElementById("priceHint");
    const totalInput = document.getElementById("totalAmount");
    if (!calc) {
      hint.textContent = "";
      return;
    }
    const resetLink = totalTouchedByUser
      ? ` · <a href="#" id="resetPriceLink" style="color:var(--clay-dark);">ใช้ราคาปกติ</a>`
      : "";
    hint.innerHTML = `ราคาปกติ ${fmtBaht(calc.price)} x ${calc.nights} คืน = <strong>${fmtBaht(calc.total)}</strong>${resetLink}`;
    const resetEl = document.getElementById("resetPriceLink");
    if (resetEl) {
      resetEl.addEventListener("click", (e) => {
        e.preventDefault();
        totalTouchedByUser = false;
        totalInput.value = calc.total;
        recalcPrice();
      });
    }
    if (!totalTouchedByUser) totalInput.value = calc.total;
  }

  function showMsg(text, kind = "error") {
    document.getElementById("msgBox").innerHTML = `<div class="msg ${kind}" style="margin-bottom:12px;">${text}</div>`;
  }

  function fmtDateTh(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" });
  }

  function buildSummaryText(info) {
    return [
      `ยืนยันการจอง Nawin Resort Khaokho ✅`,
      `เลขที่จอง: ${info.bookingRef}`,
      `ชื่อลูกค้า: ${info.guestName}`,
      `เช็คอิน: ${fmtDateTh(info.checkIn)}`,
      `เช็คเอาท์: ${fmtDateTh(info.checkOut)}`,
      `จำนวนผู้เข้าพัก: ${info.numGuests} ท่าน`,
      `ยอดชำระ: ${fmtBaht(info.amount)}`,
      `กรุณาชำระผ่าน QR PromptPay ด้านล่างภายใน 24 ชั่วโมง`,
    ].join("\n");
  }

  function renderPaymentQR(info) {
    const wrap = document.getElementById("paymentResultWrap");
    if (!wrap) return;
    const summaryText = buildSummaryText(info);
    if (!resortSettings.promptpay_id) {
      wrap.innerHTML = `
        <div class="msg info" style="margin-top:14px;">จองสำเร็จ แต่ยังไม่ได้ตั้งค่า PromptPay ID — แจ้งเจ้าของให้ตั้งค่าในหน้า Dashboard</div>
        <div class="card" style="margin-top:10px;">
          <textarea readonly rows="7" style="width:100%; border:none; background:transparent; resize:none; font:inherit; color:inherit;">${escapeHtml(summaryText)}</textarea>
          <button class="primary" id="copySummaryBtn" style="width:auto; padding:10px 20px;">คัดลอกข้อความ</button>
        </div>
      `;
      document.getElementById("copySummaryBtn").addEventListener("click", () => copySummary(summaryText));
      return;
    }
    const payload = buildPromptPayPayload(resortSettings.promptpay_id, info.amount);
    const url = qrImageUrl(payload, 300);
    wrap.innerHTML = `
      <div class="card" style="margin-top:14px; text-align:center; border-color:var(--clay);">
        <div style="font-weight:600; margin-bottom:6px;">เลขที่จอง ${escapeHtml(info.bookingRef)}</div>
        <img src="${url}" alt="PromptPay QR" style="width:220px; height:220px; margin:0 auto 10px; display:block; border-radius:10px;" />
        <div style="font-size:0.9rem; color:var(--ink-soft);">${escapeHtml(resortSettings.promptpay_name || "Nawin Resort Khaokho")}</div>
        <div style="font-weight:700; font-size:1.2rem; color:var(--clay-dark); margin:4px 0 12px;">${fmtBaht(info.amount)}</div>
        <textarea readonly rows="7" style="width:100%; text-align:left; border:1px solid var(--clay); border-radius:8px; padding:8px; margin-bottom:10px; font:inherit; color:inherit; background:transparent;">${escapeHtml(summaryText)}</textarea>
        <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
          <button class="primary" id="shareQrBtn" style="width:auto; padding:10px 20px;">ส่ง QR + ข้อความให้ลูกค้า</button>
          <button id="copySummaryBtn" style="width:auto; padding:10px 20px;">คัดลอกข้อความ</button>
        </div>
        <p style="font-size:0.78rem; color:var(--ink-soft); margin-top:8px;">กดปุ่มเพื่อแชร์ผ่าน LINE/ข้อความ หรือแตะรูปค้างไว้เพื่อบันทึก/ส่งต่อ</p>
      </div>
    `;
    document.getElementById("shareQrBtn").addEventListener("click", () => shareQr(url, summaryText, info));
    document.getElementById("copySummaryBtn").addEventListener("click", () => copySummary(summaryText));
  }

  async function copySummary(text) {
    try {
      await navigator.clipboard.writeText(text);
      showMsg("คัดลอกข้อความแล้ว", "success");
    } catch {
      window.prompt("คัดลอกข้อความนี้:", text);
    }
  }

  async function shareQr(url, summaryText, info) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const file = new File([blob], `qr-${info.bookingRef}.png`, { type: "image/png" });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "QR ชำระเงิน", text: summaryText });
        return;
      }
    } catch {
      // fall through to opening the image directly
    }
    window.open(url, "_blank");
  }

  async function submitBooking() {
    const unitId = document.getElementById("unitId").value;
    const guestName = document.getElementById("guestName").value.trim();
    const guestPhone = document.getElementById("guestPhone").value.trim();
    const checkIn = document.getElementById("checkIn").value;
    const checkOut = document.getElementById("checkOut").value;
    const numGuests = Number(document.getElementById("numGuests").value) || 1;
    const notes = document.getElementById("notes").value;
    let totalAmount = document.getElementById("totalAmount").value;

    if (!guestName) return showMsg("กรอกชื่อแขก");
    if (!checkIn || !checkOut) return showMsg("กรุณาเลือกวันเช็คอินและเช็คเอาท์");
    if (checkOut <= checkIn) return showMsg("วันเช็คเอาท์ต้องอยู่หลังวันเช็คอิน");

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึก...";
    try {
      const { booking } = await callStaffApi("/book", {
        idToken,
        unitId,
        checkIn,
        checkOut,
        numGuests,
        guestName,
        guestPhone,
        notes,
        totalAmount: totalAmount || undefined,
      });
      showMsg(`บันทึกสำเร็จ! เลขที่จอง ${booking.booking_ref}`, "success");
      document.getElementById("guestName").value = "";
      document.getElementById("guestPhone").value = "";
      document.getElementById("notes").value = "";
      totalTouchedByUser = false;
      recalcPrice();
      renderPaymentQR({
        bookingRef: booking.booking_ref,
        guestName,
        checkIn,
        checkOut,
        numGuests,
        amount: totalAmount || document.getElementById("totalAmount").value,
      });
    } catch (e) {
      showMsg(e.message || "บันทึกไม่สำเร็จ");
    } finally {
      btn.disabled = false;
      btn.textContent = "บันทึกการจอง";
    }
  }

  async function init() {
    try {
      await ensureLiff();
      idToken = await getIdToken();
      const { profile } = await callStaffApi("/me", { idToken });
      document.getElementById("staffLabel").textContent = `Nawin Resort Khaokho — ${profile.displayName}`;

      const { data, error } = await supabase
        .from("units")
        .select("id, name, unit_type, base_price")
        .eq("is_active", true)
        .order("unit_type");
      if (error) throw error;
      units = data || [];

      const { data: settingsRows } = await supabase.from("resort_settings").select("key, value");
      const map = {};
      for (const row of settingsRows || []) map[row.key] = row.value || "";
      resortSettings = map;

      render();
    } catch (e) {
      main.innerHTML = `<div class="msg error">${e.message || "โหลดข้อมูลไม่สำเร็จ"}</div>`;
    }
  }

  init();
</script>
</body>
</html>
